name: Capture Tahmina mobile screenshot

on:
  push:
    paths:
      - '.github/workflows/capture-mobile-screenshot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          mkdir -p /tmp/tahmina-shot
          cd /tmp/tahmina-shot
          npm init -y >/dev/null 2>&1
          npm install playwright@1.51.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Capture full mobile page
        run: |
          cat >/tmp/tahmina-shot/shot.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({
            viewport:{width:390,height:844},
            deviceScaleFactor:2,
            isMobile:true,
            hasTouch:true,
            userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1'
          });
          const page = await context.newPage();
          let ok=false;
          for (const url of ['https://tahmina.tanem.ru/','https://ichaey.github.io/Tahmina-tanem/']) {
            try {
              const r=await page.goto(url,{waitUntil:'networkidle',timeout:60000});
              if (r && r.ok()) { ok=true; break; }
            } catch(e) {}
          }
          if(!ok) throw new Error('Could not open Tahmina site');
          await page.waitForTimeout(2500);
          const total=await page.evaluate(()=>Math.max(document.body.scrollHeight,document.documentElement.scrollHeight));
          for(let y=0;y<total;y+=650){await page.evaluate(v=>window.scrollTo(0,v),y);await page.waitForTimeout(120)}
          await page.evaluate(()=>window.scrollTo(0,0));
          await page.waitForTimeout(800);
          await page.screenshot({path:'tahmina-mobile-full.png',fullPage:true});
          await browser.close();
          NODE
          cd /tmp/tahmina-shot
          node shot.mjs
          cp tahmina-mobile-full.png "$GITHUB_WORKSPACE/tahmina-mobile-full.png"
      - name: Commit screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tahmina-mobile-full.png
          git commit -m "Add full mobile screenshot of Tahmina" || exit 0
          git push
